<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Loja de Roupas</title>
</head>

<body>
<div class="produto">
  <img
    src="https://via.placeholder.com/300"
    alt="Imagem do produto"
    class="produto-img"
  />

  <div class="produto-info">
    <h2 class="produto-nome">Nome do produto</h2>

    <p class="produto-descricao">
      Descrição detalhada do produto.
      Adicione aqui as características e benefícios.
    </p>

    <p class="produto-preco">R$ 99,90</p>

    <button class="produto-botao">
      Comprar agora
    </button>
  </div>
</div>


</body>

</html>
